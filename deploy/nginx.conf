# Sample nginx reverse proxy for OneMoreTime on a public VPS.
# Place alongside certbot TLS certs, then:
#   sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/onemoretime
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace music.example.com and upstream as needed.
# App listens on 127.0.0.1:8000 (docker publish or systemd).

upstream onemoretime_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # ACME / redirect to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.example.com;

    # TLS — obtain with:
    #   sudo certbot --nginx -d music.example.com
    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Large uploads (audio / .torrent)
    client_max_body_size 200m;

    # Security headers (app also sets some; nginx reinforces)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://onemoretime_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming / Range seek
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
